services:
  - type: web
    name: ai-travel-planner-agent
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: GOOGLE_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash
