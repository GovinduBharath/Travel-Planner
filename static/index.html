<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Travel Planner
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1f2937;
        }


        .container {

            max-width: 900px;

            margin:
                40px auto;

            padding:
                20px;
        }


        .card {

            background: white;

            border-radius:
                18px;

            padding:
                30px;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );
        }


        h1 {

            text-align: center;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        .architecture {

            text-align: center;

            background:
                #eef2ff;

            padding:
                12px;

            border-radius:
                10px;

            margin-bottom:
                25px;

            font-size:
                14px;
        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }


        .full {

            grid-column:
                1 / -1;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;
        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;
        }


        input:focus {

            outline: none;

            border-color:
                #4f46e5;
        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background:
                #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background:
                #4338ca;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #status {

            margin-top: 20px;

            text-align: center;

            color: #6b7280;
        }


        .tools {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 20px;
        }


        .tool {

            background:
                #eef2ff;

            color:
                #3730a3;

            padding:
                8px 12px;

            border-radius:
                20px;

            font-size:
                13px;
        }


        pre {

            margin-top: 20px;

            background:
                #111827;

            color:
                #f9fafb;

            padding:
                20px;

            border-radius:
                12px;

            white-space:
                pre-wrap;

            line-height:
                1.6;

            overflow-x:
                auto;
        }


        @media(max-width:650px) {

            .grid {

                grid-template-columns:
                    1fr;
            }

            .full {

                grid-column:
                    auto;
            }
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <h1>
            ✈️ AI Travel Planner
        </h1>


        <p class="subtitle">

            Plan your trip using
            LangChain + LangGraph + Gemini

        </p>


        <div class="architecture">

            🤖 Gemini →
            🧠 LangGraph →
            🔧 Travel Tools →
            📋 Final Itinerary

        </div>


        <!-- ==================================================
             FORM
        =================================================== -->

        <form id="travelForm">


            <div class="grid">


                <!-- STARTING CITY -->

                <div>

                    <label>
                        Starting City
                    </label>

                    <input
                        id="origin"
                        placeholder="Enter your city"
                        required
                    >

                </div>


                <!-- DESTINATION -->

                <div>

                    <label>
                        Destination
                    </label>

                    <input
                        id="destination"
                        placeholder="Enter destination"
                        required
                    >

                </div>


                <!-- BUDGET -->

                <div>

                    <label>
                        Budget (USD)
                    </label>

                    <input
                        id="budget"
                        placeholder="$500"
                        required
                    >

                </div>


                <!-- DURATION -->

                <div>

                    <label>
                        Duration
                    </label>

                    <input
                        id="duration"
                        placeholder="4 days"
                        required
                    >

                </div>


                <!-- INTERESTS -->

                <div class="full">

                    <label>
                        Interests
                    </label>

                    <input
                        id="interests"
                        placeholder="e.g. beaches, food, sightseeing"
                    >

                </div>


            </div>


            <button
                id="submitBtn"
                type="submit"
            >

                🤖 Generate Travel Plan

            </button>


        </form>


        <!-- ==================================================
             STATUS
        =================================================== -->

        <div id="status"></div>


        <!-- ==================================================
             TOOLS USED
        =================================================== -->

        <div id="toolBox"></div>


        <!-- ==================================================
             RESULT
        =================================================== -->

        <pre id="result">

Your AI-generated travel plan will appear here...

        </pre>


    </div>

</div>


<script>


// ============================================================
// ELEMENTS
// ============================================================

const form =
    document.getElementById(
        "travelForm"
    );


const button =
    document.getElementById(
        "submitBtn"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const resultBox =
    document.getElementById(
        "result"
    );


const toolBox =
    document.getElementById(
        "toolBox"
    );


// ============================================================
// FORM SUBMISSION
// ============================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // Disable button
        button.disabled = true;


        // Status
        statusBox.textContent =
            "🤖 LangGraph Agent is researching your trip...";


        // Clear previous results
        resultBox.textContent = "";

        toolBox.innerHTML = "";


        // ====================================================
        // USER INPUT
        // ====================================================

        const data = {

            origin:
                document
                .getElementById("origin")
                .value,

            destination:
                document
                .getElementById("destination")
                .value,

            budget:
                document
                .getElementById("budget")
                .value,

            duration:
                document
                .getElementById("duration")
                .value,

            interests:
                document
                .getElementById("interests")
                .value

        };


        try {


            // =================================================
            // API REQUEST
            // =================================================

            const response =
                await fetch(
                    "/api/plan",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            const result =
                await response.json();


            // =================================================
            // ERROR
            // =================================================

            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Something went wrong"
                );

            }


            // =================================================
            // SUCCESS
            // =================================================

            statusBox.textContent =
                "✅ Travel plan generated successfully!";


            // =================================================
            // TOOLS USED
            // =================================================

            const tools = [

                ...new Set(

                    (
                        result.tools_used ||
                        []
                    )
                    .map(
                        item =>
                            item.tool
                    )

                )

            ];


            if (tools.length > 0) {

                toolBox.innerHTML =

                    '<div class="tools">' +

                    tools
                    .map(

                        tool =>

                            `<span class="tool">
                                🔧 ${tool}
                            </span>`

                    )
                    .join("") +

                    '</div>';

            }


            // =================================================
            // FINAL PLAN
            // =================================================

            resultBox.textContent =
                result.plan ||
                "No travel plan generated.";


        }

        catch(error) {


            statusBox.textContent =
                "❌ Error: " +
                error.message;


            resultBox.textContent =
                "Please check your API keys, Render environment variables, and deployment logs.";

        }

        finally {

            button.disabled = false;

        }

    }

);

</script>


</body>

</html>
