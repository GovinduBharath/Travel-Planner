<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Travel Planner Agent
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1f2937;
        }


        .container {

            max-width: 900px;

            margin:
                40px auto;

            padding:
                20px;
        }


        .card {

            background: white;

            border-radius:
                18px;

            padding:
                30px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.1);
        }


        h1 {

            text-align: center;

            margin-bottom:
                8px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom:
                30px;
        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                18px;
        }


        .full {

            grid-column:
                1 / -1;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom:
                6px;
        }


        input {

            width: 100%;

            padding:
                13px;

            border:
                1px solid #d1d5db;

            border-radius:
                9px;

            font-size:
                15px;
        }


        input:focus {

            outline: none;

            border-color:
                #4f46e5;
        }


        button {

            width: 100%;

            margin-top:
                25px;

            padding:
                14px;

            border: none;

            border-radius:
                9px;

            background:
                #4f46e5;

            color: white;

            font-size:
                16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background:
                #4338ca;
        }


        button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;
        }


        #status {

            margin-top:
                20px;

            text-align: center;

            color:
                #6b7280;
        }


        .tools {

            display: flex;

            flex-wrap: wrap;

            gap:
                8px;

            margin-top:
                20px;
        }


        .tool {

            background:
                #eef2ff;

            color:
                #3730a3;

            padding:
                8px 12px;

            border-radius:
                20px;

            font-size:
                13px;
        }


        pre {

            margin-top:
                20px;

            background:
                #111827;

            color:
                #f9fafb;

            padding:
                20px;

            border-radius:
                12px;

            white-space:
                pre-wrap;

            line-height:
                1.6;

            overflow-x:
                auto;
        }


        @media(max-width: 650px) {

            .grid {

                grid-template-columns:
                    1fr;
            }

            .full {

                grid-column:
                    auto;
            }
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <h1>
            ✈️ AI Travel Planner
        </h1>


        <p class="subtitle">

            Gemini Agent Core →
            Flights →
            Hotels →
            Places →
            Weather

        </p>


        <!-- ============================= -->
        <!-- FORM -->
        <!-- ============================= -->

        <form id="travelForm">


            <div class="grid">


                <!-- Origin -->

                <div>

                    <label>
                        Starting City
                    </label>

                    <input
                        id="origin"
                        value="Hyderabad"
                        required
                    >

                </div>


                <!-- Destination -->

                <div>

                    <label>
                        Destination
                    </label>

                    <input
                        id="destination"
                        placeholder="Goa"
                        required
                    >

                </div>


                <!-- Budget -->

                <div>

                    <label>
                        Budget
                    </label>

                    <input
                        id="budget"
                        placeholder="INR 30000"
                        required
                    >

                </div>


                <!-- Duration -->

                <div>

                    <label>
                        Duration
                    </label>

                    <input
                        id="duration"
                        placeholder="4 days"
                        required
                    >

                </div>


                <!-- Interests -->

                <div class="full">

                    <label>
                        Interests
                    </label>

                    <input
                        id="interests"
                        value="beaches, food, sightseeing"
                    >

                </div>


            </div>


            <button
                id="submitBtn"
                type="submit"
            >

                Generate Travel Plan

            </button>


        </form>


        <!-- ============================= -->
        <!-- STATUS -->
        <!-- ============================= -->

        <div id="status"></div>


        <!-- ============================= -->
        <!-- TOOLS USED -->
        <!-- ============================= -->

        <div id="toolBox"></div>


        <!-- ============================= -->
        <!-- RESULT -->
        <!-- ============================= -->

        <pre id="result">

Your AI travel plan will appear here...

        </pre>


    </div>

</div>


<script>


const form =
    document.getElementById(
        "travelForm"
    );


const button =
    document.getElementById(
        "submitBtn"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const resultBox =
    document.getElementById(
        "result"
    );


const toolBox =
    document.getElementById(
        "toolBox"
    );



/* =====================================
   FORM SUBMISSION
   ===================================== */

form.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        button.disabled = true;


        statusBox.textContent =
            "🤖 Agent is researching your trip...";


        resultBox.textContent =
            "";


        toolBox.innerHTML =
            "";



        /* ================================
           COLLECT USER INPUT
           ================================= */

        const data = {

            origin:
                document
                .getElementById("origin")
                .value,

            destination:
                document
                .getElementById("destination")
                .value,

            budget:
                document
                .getElementById("budget")
                .value,

            duration:
                document
                .getElementById("duration")
                .value,

            interests:
                document
                .getElementById("interests")
                .value
        };



        try {


            /* ============================
               SEND REQUEST TO FASTAPI
               ============================ */

            const response =
                await fetch(
                    "/api/plan",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );



            const result =
                await response.json();



            /* ============================
               ERROR HANDLING
               ============================ */

            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Something went wrong"
                );
            }



            /* ============================
               SUCCESS
               ============================ */

            statusBox.textContent =
                "✅ Travel plan generated!";



            /* ============================
               SHOW TOOLS
               ============================ */

            const tools =
                [
                    ...new Set(

                        (result.tools_used || [])
                        .map(
                            item =>
                                item.tool
                        )
                    )
                ];



            toolBox.innerHTML =

                '<div class="tools">' +

                tools
                .map(
                    tool =>
                        `<span class="tool">
                            🔧 ${tool}
                         </span>`
                )
                .join("") +

                '</div>';



            /* ============================
               SHOW FINAL PLAN
               ============================ */

            resultBox.textContent =
                result.plan ||
                "No travel plan generated.";


        }

        catch(error) {


            statusBox.textContent =
                "❌ Error: " +
                error.message;


            resultBox.textContent =
                "Please check your API keys and try again.";
        }


        finally {

            button.disabled =
                false;
        }

    }
);

</script>


</body>

</html>
